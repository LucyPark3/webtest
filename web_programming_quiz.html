px", "900px", "400px"], "why": "백분율 너비는 900×25%=225px이고 최소 너비 360px보다 작아질 수 없으므로 360px이다.", "topic": "CSS 단위", "type": "mc", "high": true, "correct": 0}, {"q": "루트 요소의 `font-size`가 24px이다. `font-size: 1.25rem` 요소의 글자 크기는?", "a": "30px", "options": ["1.25px", "30px", "24px", "25.25px"], "why": "rem은 루트 글자 크기 기준이므로 24×1.25=30px이다.", "topic": "CSS 단위", "type": "mc", "high": true, "correct": 1}, {"q": "루트 요소의 `font-size`가 22px이다. `font-size: 1rem` 요소의 글자 크기는?", "a": "22px", "options": ["23px", "1px", "22px", "22px"], "why": "rem은 루트 글자 크기 기준이므로 22×1=22px이다.", "topic": "CSS 단위", "type": "mc", "high": true, "correct": 2}, {"q": "다음 네 요소가 같은 위치에 겹치고 같은 스태킹 컨텍스트에 있다. 맨 위에 그려지는 요소는?\n```css\n#box1 { position: static; }\n#box2 { position: absolute; z-index: 10; }\n#box3 { position: absolute; z-index: 100; }\n#box4 { position: static; z-index: 1000; }\n```", "a": "#box3", "options": ["#box1", "#box4", "#box3", "#box2"], "why": "기본 흐름의 static 요소에는 z-index가 일반적으로 적용되지 않는다. 위치 지정 요소 중 z-index가 더 큰 box3(100)가 위다.", "topic": "position", "type": "mc", "high": true, "correct": 2}, {"q": "다음 요소의 최종 글자색은? (다른 스타일 없음)\n```html\n<div id=\"app\" class=\"item\">텍스트<\/div>\n```\n```css\ndiv { color: gray; }\n#app { color: blue; }\n.item { color: red; }\n```", "a": "blue", "options": ["green", "gray", "blue", "red"], "why": "ID 선택자 #app는 클래스 및 태그 선택자보다 우선하므로 blue가 적용된다.", "topic": "우선순위", "type": "mc", "high": true, "correct": 2}, {"q": "CSS에서 자손 선택자와 자식 선택자의 차이를 예시로 설명하시오. 핵심 키워드를 3개 이상 포함하시오.", "a": "div p는 div의 모든 자손 p, div > p는 바로 아래 자식 p만 선택한다.", "options": ["div p는 div의 모든 자손 p, div > p는 바로 아래 자식 p만 선택한다."], "why": "div p는 div의 모든 자손 p, div > p는 바로 아래 자식 p만 선택한다.", "topic": "서술형", "type": "desc", "high": false}, {"q": "HTML의 의미 요소 `<header>`가 나타내는 문서 영역을 설명하시오. (연습 19)", "a": "문서 또는 구역의 머리말", "options": ["문서 또는 구역의 머리말"], "why": "문서 또는 구역의 머리말", "topic": "단답형", "type": "short", "high": false}, {"q": "다음 CSS의 요소가 차지하는 테두리까지의 가로 길이는? (기본 content-box)\n```css\ndiv { width: 600px; padding: 16px; border: 1px solid; margin: 5px; }\n```", "a": "634px", "options": ["634px", "632px", "644px", "600px"], "why": "테두리까지 = width 600 + 좌우 padding 32 + 좌우 border 2 = 634px. margin은 포함하지 않는다.", "topic": "박스 모델", "type": "mc", "high": true, "correct": 0}]];let idx=0,answers=[],graded=false,onlyWrong=false,started=Date.now();const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(s){return esc(s).replace(/```(?:html|css)?\n([\s\S]*?)```/g,(_,x)=>'<pre><code>'+x+'</code></pre>').replace(/\n/g,'<br>')}function render(){graded=false;onlyWrong=false;answers=Array(25).fill(null);started=Date.now();$('score').innerHTML='';$('questions').innerHTML='';DATA[idx].forEach((q,i)=>{const item=document.createElement('section');item.className='question';item.dataset.n=i;let h='<span class="badge">'+(q.type==='mc'?'객관식':q.type==='short'?'단답형':'서술형')+' · '+esc(q.topic)+'</span><h3>'+(i+1)+'. '+fmt(q.q)+'</h3>';if(q.type==='mc')h+=q.options.map((opt,j)=>'<button class="choice" data-opt="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(opt)+'</button>').join('');else h+='<textarea class="answer" placeholder="여기에 답을 적으세요."></textarea>';h+='<div class="explain hide"></div>';item.innerHTML=h;$('questions').appendChild(item);item.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(graded)return;answers[i]=+btn.dataset.opt;item.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===btn));progress()});let ta=item.querySelector('textarea');if(ta)ta.addEventListener('input',()=>{answers[i]=ta.value.trim();progress()})});progress()}function progress(){let n=answers.filter(v=>v!==null&&v!=='').length;$('count').textContent=n+' / 25 응답';$('bar').style.width=n*4+'%'}function grade(){graded=true;let correct=0,mcTotal=0;document.querySelectorAll('.question').forEach((item,i)=>{let q=DATA[idx][i],e=item.querySelector('.explain');e.classList.remove('hide');if(q.type==='mc'){mcTotal++;if(answers[i]===q.correct)correct++;item.querySelectorAll('.choice').forEach((btn,j)=>{btn.classList.toggle('correct',j===q.correct);btn.classList.toggle('wrong',answers[i]===j&&j!==q.correct)});e.innerHTML='<b>정답: '+String.fromCharCode(65+q.correct)+'. '+esc(q.a)+'</b><br>'+esc(q.why)}else e.innerHTML='<b>모범답안 / 채점 키워드</b><br>'+esc(q.a)+'<br><small>자가 채점: 답안에 핵심 개념과 논리가 포함됐는지 확인하세요.</small>'});$('score').innerHTML='<p class="stat">객관식 '+correct+' / '+mcTotal+'개 정답</p><p class="tiny">단답형·서술형은 자동 점수에서 제외하며 모범답안을 기준으로 확인하세요.</p>';if(onlyWrong)filterWrong()}function filterWrong(){document.querySelectorAll('.question').forEach((el,i)=>{const q=DATA[idx][i];el.classList.toggle('hide',q.type==='mc'&&answers[i]===q.correct)})}$('set').innerHTML=DATA.map((_,i)=>'<option value="'+i+'">실전 '+(i+3)+'회차 · 25문제</option>').join('');$('set').onchange=e=>{idx=+e.target.value;render();window.scrollTo(0,0)};$('reset').onclick=()=>{if(confirm('이 회차의 답안을 지울까요?'))render()};$('grade').onclick=()=>{grade();$('score').scrollIntoView({behavior:'smooth',block:'center'})};$('wrong').onclick=()=>{if(!graded)grade();onlyWrong=true;filterWrong();$('questions').scrollIntoView({behavior:'smooth'})};$('all').onclick=()=>{onlyWrong=false;document.querySelectorAll('.question').forEach(x=>x.classList.remove('hide'))};setInterval(()=>{let sec=Math.floor((Date.now()-started)/1000);$('clock').textContent='경과 '+Math.floor(sec/60)+'분 '+sec%60+'초 / 권장 100분'},1000);render();
